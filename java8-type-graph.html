function draw(){
  raf=0;step();const d=Math.min(devicePixelRatio||1,2);
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,Hh);
  ctx.setTransform(d*sc,0,0,d*sc,d*tx,d*ty);ctx.globalAlpha=1;
  const x0=-tx/sc,y0=-ty/sc,x1=x0+W/sc,y1=y0+Hh/sc,far=sc<.4;
  const vis=e=>{const c=N[e[0]],p=N[e[1]],ax=p.x+p.w/2,bx=c.x+c.w/2,ay=p.y+H,by=c.y;return !((ax<x0&&bx<x0)||(ax>x1&&bx>x1)||(ay<y0&&by<y0)||(ay>y1&&by>y1))};
  /* package clusters */
  ctx.textAlign=far?'center':'left';ctx.textBaseline='middle';
  for(const c of CL){
    if(c.x>x1||c.y>y1||c.x+c.w<x0||c.y+c.h<y0)continue;
    rr(c.x,c.y,c.w,c.h,14);ctx.fillStyle=T.cl;ctx.fill();ctx.lineWidth=Math.max(1,1.2/sc);ctx.strokeStyle=T.line;ctx.stroke();
    if(far){const fs=Math.min(c.w/(c.p.length*.62),c.h*.4);ctx.font=`600 ${fs}px system-ui,sans-serif`;ctx.globalAlpha=.55;ctx.fillStyle=T.mute;ctx.fillText(c.p,c.x+c.w/2,c.y+c.h/2);ctx.globalAlpha=1}
    else{ctx.font='600 14px system-ui,sans-serif';ctx.fillStyle=T.ink;ctx.fillText(`${c.p}  (${c.a.length})`,c.x+PAD,c.y+PAD+8)}
  }
  /* links: only for the hovered or pinned chip */
  if(rel){
    for(const t of [0,1]){
      ctx.beginPath();ctx.setLineDash(t?[6,5]:[]);const ar=new Path2D();
      for(const e of E){if(e[2]===t&&(rel.a.has(e[0])||rel.d.has(e[1]))&&vis(e)){curve(e);arrow(ar,e)}}
      ctx.globalAlpha=.9;ctx.lineWidth=Math.max(1.6,2/sc);ctx.strokeStyle=ctx.fillStyle=T.ink;ctx.stroke();ctx.fill(ar);
    }
  }
  ctx.setLineDash([]);
  /* chips */
  ctx.font=MONO;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const n of O){
    if(n.x>x1||n.y>y1||n.x+n.w<x0||n.y+H<y0)continue;
    const dim=rel&&!(rel.a.has(n.i)||rel.d.has(n.i));
    ctx.globalAlpha=dim?.16:1;
    if(far){ctx.fillStyle=n.c[0];ctx.fillRect(n.x,n.y,n.w,H);continue}
    rr(n.x,n.y,n.w,H,8);ctx.fillStyle=T.chip;ctx.fill();
    let s=n.c[0];
    if(n.c.length>1){if(!n.g||n.gx!==n.x){n.g=ctx.createLinearGradient(n.x,0,n.x+n.w,0);n.g.addColorStop(0,n.c[0]);n.g.addColorStop(1,n.c[1]);n.gx=n.x}s=n.g}
    ctx.lineWidth=2.5;ctx.strokeStyle=s;ctx.stroke();
    if(sc>.45){ctx.fillStyle=T.ink;ctx.fillText(n.name,n.x+n.w/2,n.y+H/2+.5)}
  }
  ctx.globalAlpha=1;
  if(cur){rr(cur.x-3,cur.y-3,cur.w+6,H+6,10);ctx.lineWidth=Math.max(1.5,1.5/sc);ctx.strokeStyle=T.ink;ctx.stroke()}
  if(live)dirty();
}

/* theme and legend */
const swStyle=c=>`background:linear-gradient(var(--chip),var(--chip)) padding-box,linear-gradient(90deg,${c[0]},${c[c.length-1]}) border-box`;
function applyTheme(){
  dark=isDark();const cs=getComputedStyle(document.documentElement);
  T={bg:cs.getPropertyValue('--bg'),cl:cs.getPropertyValue('--cl'),ink:cs.getPropertyValue('--ink'),mute:cs.getPropertyValue('--mute'),chip:cs.getPropertyValue('--chip'),edge:cs.getPropertyValue('--edge'),line:cs.getPropertyValue('--line')};
  N.forEach(n=>{n.c=cols(n.k,n.s);n.g=null});
  let h='<div class="note">Left swatch is since 1.0 (lighter), right is since 1.8 (deeper)</div>';
  for(const k of ['F','M','I','C','E','A','X'])h+=`<div class="r"><i class="sw" style="${swStyle(cols(k,0))}"></i><i class="sw" style="${swStyle(cols(k,8))}"></i>${KN[k]}</div>`;
  h+=`<div class="r"><svg width="46" height="10" aria-hidden="true"><line x1="0" y1="5" x2="46" y2="5" stroke="currentColor" stroke-width="1.8"/></svg>extends</div>`;
  h+=`<div class="r"><svg width="46" height="10" aria-hidden="true"><line x1="0" y1="5" x2="46" y2="5" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 5"/></svg>implements</div>`;
  h+='<div class="note">Arrows point from parent to child</div>';
  document.getElementById('lg').innerHTML=h;dirty();
}

/* interaction */
function related(n){
  const a=new Set([n.i]),d=new Set([n.i]);let q=[n.i];
  while(q.length){const u=q.pop();for(const p of N[u].P)if(!a.has(p)){a.add(p);q.push(p)}}
  q=[n.i];
  while(q.length){const u=q.pop();for(const c of N[u].C)if(!d.has(c)){d.add(c);q.push(c)}}
  return{a,d};
}
function setFocus(){const f=sel||hov;if(f!==cur){cur=f;rel=f?related(f):null;dirty()}}
function pin(n){sel=n;setFocus();cnt.textContent=n?`${n.full}: ${n.P.length} parent${n.P.length===1?'':'s'}, ${n.C.length} direct child${n.C.length===1?'':'ren'}. Click empty space to clear.`:HINT}
function hit(mx,my){const x=(mx-tx)/sc,y=(my-ty)/sc;for(let i=O.length-1;i>=0;i--){const n=O[i];if(x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+H)return n}return null}
let tipN=null,tipW=0;
function tip(n,e){
  if(!n){tipEl.style.display='none';tipN=null;return}
  if(n===tipN){tipEl.style.transform=`translate(${Math.min(e.clientX+14,innerWidth-tipW-8)}px,${e.clientY+16}px)`;return}
  tipEl.innerHTML=`<b>${n.full}</b><span>${KN[n.k]}, since 1.${n.s}${n.est?' (estimated from package)':''}</span><span>${n.P.length} parent${n.P.length===1?'':'s'}, ${n.C.length} direct child${n.C.length===1?'':'ren'}</span>`;
  tipEl.style.display='block';
  tipN=n;tipW=tipEl.offsetWidth;tipEl.style.transform=`translate(${Math.min(e.clientX+14,innerWidth-tipW-8)}px,${e.clientY+16}px)`;
}
let drag=null,pan=null,down=null,moved=0,lx=0,ly=0,lt=0;
cv.onpointerdown=e=>{
  cv.setPointerCapture(e.pointerId);
  const n=hit(e.offsetX,e.offsetY);
  down={x:e.clientX,y:e.clientY};moved=0;anc=null;tsc=sc;vx=vy=0;lx=e.clientX;ly=e.clientY;
  if(n){drag={n,ox:(e.offsetX-tx)/sc-n.x,oy:(e.offsetY-ty)/sc-n.y};O.splice(O.indexOf(n),1);O.push(n);hov=n;setFocus();dirty()}
  else pan={x:e.clientX,y:e.clientY,tx,ty};
  cv.style.cursor='grabbing';
};
cv.onpointermove=e=>{
  if(drag){moved=Math.max(moved,Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y));drag.n.x=(e.offsetX-tx)/sc-drag.ox;drag.n.y=(e.offsetY-ty)/sc-drag.oy;tip(drag.n,e);dirty()}
  else if(pan){moved=Math.max(moved,Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y));vx=e.clientX-lx;vy=e.clientY-ly;lx=e.clientX;ly=e.clientY;lt=performance.now();tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;dirty()}
  else{const n=hit(e.offsetX,e.offsetY);hov=n;cv.style.cursor=n?'pointer':'grab';tip(n,e);setFocus()}
};
cv.onpointerup=()=>{
  if(down&&moved<5)pin(drag?drag.n:null);
  if(moved<5||performance.now()-lt>80)vx=vy=0;
  drag=pan=null;down=null;cv.style.cursor='grab';dirty();
};
cv.onpointerleave=()=>{if(!drag){hov=null;tip(null);setFocus()}};
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;
  tsc=Math.min(4,Math.max(.03,tsc*Math.exp(-dy*.0015)));
  anc={mx:e.offsetX,my:e.offsetY,wx:(e.offsetX-tx)/sc,wy:(e.offsetY-ty)/sc};vx=vy=0;dirty();
},{passive:false});

/* search */
const q=document.getElementById('q'),cnt=document.getElementById('cnt'),HINT=cnt.textContent;let ml=[],mi=0;
q.oninput=()=>{
  const v=q.value.trim().toLowerCase();mi=0;
  ml=v?N.filter(n=>n.full.toLowerCase().includes(v)).sort((a,b)=>(b.name.toLowerCase()===v)-(a.name.toLowerCase()===v)||(b.name.toLowerCase().startsWith(v))-(a.name.toLowerCase().startsWith(v))):[];
  cnt.textContent=v?`${ml.length} match${ml.length===1?'':'es'}${ml.length?', press Enter to jump':''}`:HINT;
  if(!v){sel=null;setFocus()}
};
q.onkeydown=e=>{if(e.key==='Enter'&&ml.length){const n=ml[mi++%ml.length];sc=tsc=1.1;anc=null;vx=vy=0;tx=W/2-(n.x+n.w/2)*sc;ty=Hh/2-(n.y+H/2)*sc;pin(n);dirty()}};
addEventListener('keydown',e=>{if(e.key==='Escape')pin(null)});

mq.onchange=applyTheme;
addEventListener('resize',resize);
if(innerWidth<700)document.getElementById('leg').open=false;
applyTheme();resize();fit();dirty();
</script>
</body>
</html>
